name: Creatio calls → Supabase (hourly)

on:
  workflow_dispatch:
  schedule:
    # каждый час на 59-й минуте (UTC)
    - cron: "*/5 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: |
          python load_hours_file_to_supabase_noproxy.py
